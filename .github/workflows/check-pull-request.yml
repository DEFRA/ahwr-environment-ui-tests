name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

# Uncomment this to run the tests in your test suite
#  tests:
#    name: Run Journey Tests
#    runs-on: ubuntu-latest
#    steps:
#      - uses: DEFRA/cdp-node-journey-test-suite-template/run-journey-tests@main

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # WebdriverIO declares dependency ranges that cannot reach the
          # patched versions, and extract-zip has no patched release at all.
          # Reviewed and accepted; prune entries as upstream bumps.
          allow-ghsas: >-
            GHSA-ggr8-5vv4-36mx,
            GHSA-jmr9-qjv8-65gv,
            GHSA-5c6j-r48x-rmvq,
            GHSA-qj8w-gfj5-8c6v,
            GHSA-w5hq-g745-h8pq
